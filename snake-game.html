<title>נחש חכם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Suez+One&family=Fredoka:wght@400;500;600;700&family=Heebo:wght@400;700;900&display=swap">
<style>
:root{
  --pine-900:#0B2E2A;
  --pine-800:#0F3A34;
  --pine-700:#14493F;
  --pine-600:#1B6355;
  --sand:#F3E3C3;
  --sand-dim:#E3CFA8;
  --sand-line:#E0C99C;
  --ink:#FBF3E2;
  --ink-soft:#C8DCD2;
  --marigold:#F5A524;
  --marigold-deep:#D9821A;
  --mint:#5FD9A4;
  --coral:#E85D42;
  --shadow:0 10px 0 rgba(0,0,0,.22);
  --r-sm:10px; --r-md:16px; --r-lg:24px;
  --font-display:'Suez One','Heebo',Georgia,serif;
  --font-ui:'Fredoka','Heebo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:
    radial-gradient(120% 90% at 50% -10%, #17564A 0%, rgba(23,86,74,0) 60%),
    var(--pine-900);
  color:var(--ink);
  font-family:var(--font-ui);
  overflow:hidden;
  overscroll-behavior:none;
  user-select:none;
}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer;}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--marigold);outline-offset:3px;border-radius:8px;}

/* ---------- app shell ---------- */
.app{position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;padding:8px 10px 10px;}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;}
.hud-side{display:flex;gap:6px;}
.icon-btn{
  width:40px;height:40px;border-radius:12px;font-size:18px;line-height:1;
  background:var(--pine-700);border:2px solid rgba(255,255,255,.08);
  display:grid;place-items:center;transition:transform .12s ease,background .12s ease;
}
.icon-btn:active{transform:scale(.92);}
.hud-stats{display:flex;gap:6px;}
.stat{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-width:62px;padding:3px 10px 5px;border-radius:12px;
  background:var(--pine-700);border:2px solid rgba(255,255,255,.07);
}
.stat-k{font-size:10px;letter-spacing:.06em;color:var(--ink-soft);opacity:.85;}
.stat-v{font-family:var(--font-display);font-size:20px;line-height:1.05;font-variant-numeric:tabular-nums;}
.stat--score .stat-v{color:var(--marigold);}
.stat--level .stat-v{color:var(--mint);}

/* ---------- question plank ---------- */
.prompt{
  flex:0 0 auto;position:relative;
  background:linear-gradient(180deg,#F8EDD6 0%,var(--sand) 100%);
  border-radius:var(--r-lg);
  border-bottom:5px solid #C9AE7C;
  padding:10px 16px 12px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  min-height:86px;
  box-shadow:0 6px 0 rgba(0,0,0,.25);
}
.prompt.shake{animation:shake .38s;}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-9px) rotate(-.6deg)}
  45%{transform:translateX(8px) rotate(.5deg)}
  70%{transform:translateX(-5px)}
}
.equation{
  direction:ltr;font-family:var(--font-display);
  font-size:clamp(30px,8.4vw,52px);color:var(--pine-900);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
}
.equation .q{color:var(--marigold-deep);animation:pulseQ 1.1s ease-in-out infinite;display:inline-block;}
@keyframes pulseQ{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}

.word-icon{font-size:clamp(34px,9vw,54px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.14));}
.word{display:flex;gap:5px;direction:rtl;}
.ltr{
  font-family:var(--font-display);
  font-size:clamp(26px,7vw,44px);line-height:1;
  min-width:1.1em;padding:4px 7px 8px;border-radius:10px;text-align:center;
  color:#B9A47C;background:rgba(0,0,0,.05);transition:all .18s ease;
}
.ltr.done{color:#0B2E2A;background:var(--mint);}
.ltr.now{
  color:var(--marigold-deep);background:#fff;
  box-shadow:0 0 0 3px var(--marigold);
  animation:pulseQ 1.1s ease-in-out infinite;
}
/* ---------- board ---------- */
.board-wrap{flex:1 1 auto;min-height:0;display:grid;place-items:center;}
canvas{
  display:block;border-radius:var(--r-lg);
  box-shadow:0 8px 0 rgba(0,0,0,.3), 0 0 0 4px var(--pine-600);
  touch-action:none;
}

/* ---------- thumb pad ---------- */
.pad{
  flex:0 0 auto;display:grid;justify-content:center;gap:6px;
  grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,46px);
}
.pad-btn{
  background:var(--pine-700);border:2px solid rgba(255,255,255,.09);
  border-bottom-width:5px;border-radius:14px;
  font-size:20px;display:grid;place-items:center;color:var(--ink-soft);
  transition:transform .08s ease,background .08s ease;
}
.pad-btn:active{transform:translateY(3px);border-bottom-width:2px;background:var(--pine-600);color:var(--marigold);}
.pad .up{grid-area:1/2} .pad .left{grid-area:2/1} .pad .down{grid-area:2/2} .pad .right{grid-area:2/3}
.kbd-hint{display:none;text-align:center;font-size:12px;color:var(--ink-soft);opacity:.6;padding-bottom:2px;}
@media (hover:hover) and (pointer:fine){
  .pad{display:none;}
  .kbd-hint{display:block;}
}

/* ---------- overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:20;display:none;
  background:rgba(6,26,23,.9);backdrop-filter:blur(6px);
  overflow-y:auto;padding:18px 14px 26px;
}
.overlay.on{display:block;}
.sheet{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px;}

.brand{text-align:center;padding-top:6px;}
.brand h1{
  font-family:var(--font-display);margin:0;
  font-size:clamp(38px,12vw,62px);line-height:1;
  color:var(--sand);text-wrap:balance;
  text-shadow:0 5px 0 rgba(0,0,0,.35);
}
.brand h1 em{font-style:normal;color:var(--marigold);}
.brand p{margin:8px 0 0;font-size:14px;color:var(--ink-soft);}

.group{display:flex;flex-direction:column;gap:9px;}
.group-label{
  font-size:12px;letter-spacing:.12em;color:var(--ink-soft);opacity:.8;
  display:flex;align-items:center;gap:8px;
}
.group-label::after{content:"";flex:1;height:2px;background:rgba(255,255,255,.08);border-radius:2px;}

.skins{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.skin{
  padding:10px 6px 8px;border-radius:var(--r-md);
  background:var(--pine-800);border:2px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.skin:active{transform:scale(.96);}
.skin[aria-pressed="true"]{border-color:var(--marigold);background:var(--pine-700);transform:translateY(-2px);}
.skin-body{display:flex;align-items:center;gap:2px;height:20px;}
.skin-body i{display:block;border-radius:50%;}
.skin-name{font-size:14px;font-weight:600;}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.mode{
  text-align:right;padding:13px 14px;border-radius:var(--r-md);
  background:var(--pine-800);border:2px solid rgba(255,255,255,.07);
  display:flex;flex-direction:column;gap:3px;
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.mode:active{transform:scale(.97);}
.mode[aria-pressed="true"]{border-color:var(--marigold);background:var(--pine-700);}
.mode-ico{font-size:26px;line-height:1;}
.mode-name{font-family:var(--font-display);font-size:19px;}
.mode-sub{font-size:12px;color:var(--ink-soft);line-height:1.35;}

.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.pill{
  padding:11px 6px;border-radius:999px;font-size:15px;font-weight:600;
  background:var(--pine-800);border:2px solid rgba(255,255,255,.07);
  transition:transform .12s ease,border-color .12s ease,background .12s ease;
}
.pill:active{transform:scale(.95);}
.pill[aria-pressed="true"]{border-color:var(--marigold);background:var(--marigold);color:var(--pine-900);}

.go{
  margin-top:2px;padding:16px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,#FFC257,var(--marigold));
  color:#3B2405;font-family:var(--font-display);font-size:24px;
  border-bottom:6px solid var(--marigold-deep);
  transition:transform .1s ease,border-bottom-width .1s ease;
}
.go:active{transform:translateY(4px);border-bottom-width:2px;}

.card{
  background:var(--pine-800);border:2px solid rgba(255,255,255,.07);
  border-radius:var(--r-lg);padding:22px 18px;text-align:center;
  display:flex;flex-direction:column;gap:12px;
}
.card h2{font-family:var(--font-display);margin:0;font-size:30px;}
.big-score{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--marigold);font-variant-numeric:tabular-nums;}
.stars{font-size:32px;letter-spacing:6px;}
.sub{font-size:14px;color:var(--ink-soft);margin:0;line-height:1.5;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.btn2{
  padding:14px;border-radius:var(--r-md);font-size:16px;font-weight:600;
  background:var(--pine-700);border:2px solid rgba(255,255,255,.1);border-bottom-width:5px;
}
.btn2:active{transform:translateY(3px);border-bottom-width:2px;}
.btn2.primary{background:var(--marigold);color:#3B2405;border-bottom-color:var(--marigold-deep);}
.recap{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;}
.recap div{display:flex;flex-direction:column;gap:2px;}
.recap b{font-family:var(--font-display);font-size:22px;color:var(--mint);}
.recap span{font-size:11px;color:var(--ink-soft);}

/* toast */
.toast{
  position:fixed;left:50%;top:22%;transform:translate(-50%,0) scale(.8);
  z-index:30;pointer-events:none;opacity:0;
  background:var(--mint);color:#08251C;
  font-family:var(--font-display);font-size:24px;
  padding:10px 24px;border-radius:999px;
  box-shadow:0 8px 0 rgba(0,0,0,.28);
}
.toast.show{animation:pop 1.5s ease forwards;}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
  15%{opacity:1;transform:translate(-50%,0) scale(1.06)}
  28%{transform:translate(-50%,0) scale(1)}
  80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-26px) scale(.95)}
}

@media (max-height:640px){
  .prompt{min-height:70px;padding:6px 12px 8px;}
  .pad{grid-template-rows:repeat(2,40px);}
  .stat{min-width:56px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}
}
</style>

<div class="app" id="app" dir="rtl" lang="he" hidden>
  <header class="hud">
    <div class="hud-side">
      <button class="icon-btn" id="btnPause" aria-label="השהיה">⏸</button>
      <button class="icon-btn" id="btnSound" aria-label="צליל">🔊</button>
    </div>
    <div class="hud-stats">
      <div class="stat stat--score"><span class="stat-k">ניקוד</span><span class="stat-v" id="vScore">0</span></div>

  <section class="prompt" id="prompt" aria-live="polite"></section>

  <main class="board-wrap" id="boardWrap"><canvas id="cv"></canvas></main>

    <button class="pad-btn down" data-dir="down" aria-label="למטה">▼</button>
    <button class="pad-btn right" data-dir="right" aria-label="ימינה">▶</button>
  </nav>
</div>

<!-- ===== MENU ===== -->
<div class="overlay on" id="menu" dir="rtl" lang="he">
  <div class="sheet">
    <div class="brand">
      <h1>נחש <em>חכם</em></h1>
      <p>אוכלים את התשובה הנכונה — וגדלים</p>
    </div>

    <div class="group">
      <div class="group-label">בוחרים נחש</div>
      <div class="skins" id="skins"></div>
    </div>

    <div class="group">
      <div class="group-label">בוחרים משחק</div>
      <div class="modes">
        <button class="mode" data-mode="math" aria-pressed="true">
          <span class="mode-ico">🔢</span>
          <span class="mode-name">חשבון טעים</span>
          <span class="mode-sub">פותרים תרגיל ואוכלים את המספר הנכון</span>
        </button>
        <button class="mode" data-mode="spell" aria-pressed="false">
          <span class="mode-ico">🔤</span>
          <span class="mode-name">שביל האותיות</span>
          <span class="mode-sub">אוספים את אותיות המילה לפי הסדר</span>
        </button>
      </div>
    </div>

    <div class="group">
      <div class="group-label">רמת התחלה <span style="opacity:.7;font-size:11px">(המשחק יתאים את עצמו תוך כדי)</span></div>
      <div class="pills" id="pills">
        <button class="pill" data-diff="1" aria-pressed="true">קל</button>
        <button class="pill" data-diff="2" aria-pressed="false">בינוני</button>
        <button class="pill" data-diff="3" aria-pressed="false">קשה</button>
      </div>
    </div>

    <button class="go" id="btnStart">יאללה, מתחילים!</button>
  </div>
</div>

<!-- ===== PAUSE ===== -->
<div class="overlay" id="pauseScreen" dir="rtl" lang="he">
  <div class="sheet" style="padding-top:12vh">
    <div class="card">
      <h2>הפסקה קטנה</h2>
      <p class="sub">הנחש מחכה לך בסבלנות.</p>
      <div class="row">
        <button class="btn2 primary" id="btnResume">ממשיכים</button>
        <button class="btn2" id="btnQuit">תפריט</button>
      </div>
    </div>
  </div>
</div>

<!-- ===== GAME OVER ===== -->
<div class="overlay" id="overScreen" dir="rtl" lang="he">
  <div class="sheet" style="padding-top:8vh">
    <div class="card">
      <h2 id="overTitle">אופס!</h2>
      <p class="sub" id="overMsg">הנחש התנגש בזנב של עצמו.</p>
      <div class="big-score" id="overScore">0</div>
      <div class="stars" id="overStars">⭐</div>
      <div class="recap" id="overRecap"></div>
      <div class="row">
        <button class="btn2 primary" id="btnAgain">עוד פעם!</button>
        <button class="btn2" id="btnMenu">תפריט</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";
document.documentElement.dir = "rtl";
document.documentElement.lang = "he";

/* =========================================================
   WORD LIST — add your own here. Level is derived from the
   number of letters: 2-3 = level 1, 4 = level 2, 5+ = level 3.
   ========================================================= */
const WORDS = [
  // ---- קצרות (2-3 אותיות) ----
  {w:"אבא",e:"👨"},{w:"אמא",e:"👩"},{w:"יד",e:"✋"},{w:"פה",e:"👄"},{w:"אף",e:"👃"},
  {w:"עין",e:"👁️"},{w:"שן",e:"🦷"},{w:"רגל",e:"🦵"},{w:"לב",e:"❤️"},
  {w:"כלב",e:"🐕"},{w:"דג",e:"🐟"},{w:"פרה",e:"🐄"},{w:"סוס",e:"🐎"},{w:"צב",e:"🐢"},
  {w:"דב",e:"🐻"},{w:"גמל",e:"🐪"},{w:"עוף",e:"🐔"},
  {w:"עץ",e:"🌳"},{w:"פרח",e:"🌸"},{w:"עלה",e:"🍃"},{w:"שמש",e:"☀️"},{w:"ירח",e:"🌙"},
  {w:"ענן",e:"☁️"},{w:"גשם",e:"🌧️"},{w:"שלג",e:"❄️"},{w:"הר",e:"⛰️"},{w:"ים",e:"🌊"},
  {w:"אש",e:"🔥"},{w:"קשת",e:"🌈"},
  {w:"בית",e:"🏠"},{w:"דלת",e:"🚪"},{w:"כסא",e:"🪑"},{w:"ספה",e:"🛋️"},{w:"נר",e:"🕯️"},
  {w:"ספר",e:"📕"},{w:"לחם",e:"🍞"},{w:"מים",e:"💧"},{w:"חלב",e:"🥛"},{w:"תה",e:"🍵"},
  {w:"גזר",e:"🥕"},{w:"חסה",e:"🥬"},{w:"תות",e:"🍓"},

  // ---- בינוניות (4 אותיות) ----
  {w:"חתול",e:"🐱"},{w:"ארנב",e:"🐰"},{w:"עכבר",e:"🐭"},{w:"זברה",e:"🦓"},{w:"נמלה",e:"🐜"},
  {w:"פרפר",e:"🦋"},{w:"אריה",e:"🦁"},{w:"דובי",e:"🧸"},{w:"תנין",e:"🐊"},
  {w:"תפוח",e:"🍎"},{w:"בננה",e:"🍌"},{w:"עוגה",e:"🍰"},{w:"תפוז",e:"🍊"},{w:"אננס",e:"🍍"},
  {w:"ביצה",e:"🥚"},{w:"מזלג",e:"🍴"},{w:"כפית",e:"🥄"},{w:"צלחת",e:"🍽️"},
  {w:"כובע",e:"🧢"},{w:"מעיל",e:"🧥"},{w:"שמלה",e:"👗"},
  {w:"מיטה",e:"🛏️"},{w:"חלון",e:"🪟"},{w:"מקרר",e:"🧊"},{w:"מחשב",e:"💻"},
  {w:"כדור",e:"⚽"},{w:"אוטו",e:"🚗"},{w:"רכבת",e:"🚂"},{w:"מטוס",e:"✈️"},{w:"סירה",e:"⛵"},
  {w:"מסוק",e:"🚁"},{w:"כוכב",e:"⭐"},{w:"ילדה",e:"👧"},

  // ---- ארוכות (5-6 אותיות) ----
  {w:"גבינה",e:"🧀"},{w:"ציפור",e:"🐦"},{w:"דבורה",e:"🐝"},{w:"גלידה",e:"🍦"},

  {w:"שמיים",e:"🌤️"},{w:"כוכבים",e:"✨"},{w:"פסנתר",e:"🎹"},{w:"גיטרה",e:"🎸"},
  {w:"תופים",e:"🥁"},{w:"עיפרון",e:"✏️"},{w:"מחברת",e:"📓"},{w:"ילקוט",e:"🎒"},
  {w:"מסיבה",e:"🎉"}
];
const ALEFBET = "אבגדהוזחטיכךלמםנןסעפףצץקרשת".split("");

/* ===================== SNAKE SKINS ===================== */
const SKINS = [
  {id:"barak", name:"ברק",  body:"#F7C948", belly:"#FFE9A3", spot:"#C98A0B", eye:"#2B1B00"},
  {id:"esh",   name:"אש",   body:"#FF7A3D", belly:"#FFC5A1", spot:"#C93F12", eye:"#3A1200"},

  {id:"keshet",name:"קשת",  rainbow:true, belly:"#FFF3D0", spot:"#ffffff", eye:"#2A1240"},
  {id:"layla", name:"לילה", body:"#9B6BF0", belly:"#DCC8FF", spot:"#E9D8FF", eye:"#1A0836", glow:true}
];

/* ===================== HELPERS ===================== */
const $ = (s)=>document.querySelector(s);
const ri = (a,b)=>a+Math.floor(Math.random()*(b-a+1));

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function beep(freq,dur,type,vol,delay){
  if(!soundOn) return; const ac=audio(); if(!ac) return;
  const t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"triangle"; o.frequency.setValueAtTime(freq,t0);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.14,t0+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur+0.02);
}

  levelup(){ [392,523,659,880].forEach((f,i)=>beep(f,0.24,"square",0.09,i*0.09)); },

  tick(){ beep(880,0.05,"square",0.05); }
};

/* ===================== MATH ===================== */
function makeMath(level){
  let a,b,c,text,ans;
  switch(level){
    case 1: a=ri(1,5); b=ri(1,5); ans=a+b; text=a+" + "+b; break;
    case 2:
      if(Math.random()<0.45){ a=ri(2,6); b=ri(2,6); ans=a+b; text=a+" + "+b; }
      else { a=ri(3,10); b=ri(1,a); ans=a-b; text=a+" − "+b; }
      break;
    case 3:
      if(Math.random()<0.5){ a=ri(4,12); b=ri(3,Math.min(9,20-a)); ans=a+b; text=a+" + "+b; }
      else { a=ri(11,20); b=ri(2,9); ans=a-b; text=a+" − "+b; }
      break;
    case 4: {
      const t=pick([2,5,10]); b=ri(2,10); ans=t*b; text=t+" × "+b; break;
    }
    case 5: a=ri(2,10); b=ri(2,10); ans=a*b; text=a+" × "+b; break;
    default: {
      const k=ri(0,2);
      if(k===0){ a=ri(2,10); b=ri(2,10); ans=b; text=(a*b)+" ÷ "+a; }
      else if(k===1){ a=ri(6,18); b=ri(2,9); c=ri(2,Math.min(9,a+b-1)); ans=a+b-c; text=a+" + "+b+" − "+c; }
      else { a=ri(2,9); b=ri(2,9); c=ri(1,10); ans=a*b+c; text=a+" × "+b+" + "+c; }
    }
  }
  return {text, ans};
}
function mathWrongs(ans, n, level){
  const out=[], seen=new Set([ans]);
  const cand = shuffle([ans+1,ans-1,ans+2,ans-2,ans+10,ans-10,ans+3,ans-3,ans+5,ans-5]);
  if(level>=4) cand.push(ans+ri(1,4), Math.max(0,ans-ri(1,4)));
  for(const v of cand){ if(out.length>=n) break; if(v>=0 && !seen.has(v)){ seen.add(v); out.push(v); } }
  let g=1; while(out.length<n){ const v=ans+g; if(!seen.has(v)){seen.add(v);out.push(v);} g++; }
  return out;
}

/* ===================== SPELLING ===================== */
function wordLevel(w){ return w.length<=3?1:(w.length===4?2:3); }
function pickWord(level){
  const pool = WORDS.filter(x=>wordLevel(x.w)===level);
  const src = pool.length?pool:WORDS;
  let w = pick(src), guard=0;
  while(G.word && w.w===G.word.w && guard++<8) w = pick(src);
  return w;
}
function letterWrongs(word, idx, n){
  const correct = word[idx];
  const out=[], seen=new Set([correct]);
  const inWord = word.split("").filter(l=>l!==correct);
  while(out.length<n){
    let l;
    if(inWord.length && Math.random()<0.45) l = pick(inWord);
    else l = pick(ALEFBET);
    if(!seen.has(l)){ seen.add(l); out.push(l); }
    if(seen.size>=ALEFBET.length) break;
  }
  return out;
}

/* ===================== TOKENS ===================== */
function tokenCount(){
  if(G.mode==="math") return G.level<=2?3:(G.level<=4?4:5);
  return G.level===1?3:4;
}
function freeCells(exclude){
  const taken=new Set();
  for(const s of G.snake) taken.add(s.x+","+s.y);
  for(const t of (exclude||G.tokens)) taken.add(t.x+","+t.y);
  const head=G.snake[0];
  // keep the 3 cells directly ahead of the head clear so nothing is unavoidable
  for(let i=1;i<=3;i++) taken.add(((head.x+G.dir.x*i+GRID)%GRID)+","+((head.y+G.dir.y*i+GRID)%GRID));
  const out=[];
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++) if(!taken.has(x+","+y)) out.push({x,y});
  return out;
}
function placeToken(label, correct, existing){
  const free = freeCells(existing);
  if(!free.length) return null;
  const c = pick(free);
  const t = {x:c.x, y:c.y, label:String(label), correct:!!correct, born:G.t, pop:0};
  return t;
}
function spawnRound(){
  G.tokens = [];
  let labels;
  if(G.mode==="math"){
    G.q = makeMath(G.level);
    labels = [{v:G.q.ans, ok:true}].concat(mathWrongs(G.q.ans, tokenCount()-1, G.level).map(v=>({v, ok:false})));
  } else {
    const target = G.word.w;
    const ok = target[G.wordIdx];
    labels = [{v:ok, ok:true}].concat(letterWrongs(target, G.wordIdx, tokenCount()-1).map(v=>({v, ok:false})));
  }
  shuffle(labels);
  const placed=[];
  for(const l of labels){ const t=placeToken(l.v, l.ok, placed); if(t) placed.push(t); }
  G.tokens = placed;
  renderPrompt();
}
function replaceWrongToken(tok){
  const idx = G.tokens.indexOf(tok);
  if(idx<0) return;
  G.tokens.splice(idx,1);
  let label;
  if(G.mode==="math") label = pick(mathWrongs(G.q.ans, 4, G.level));
  else label = pick(letterWrongs(G.word.w, G.wordIdx, 4));
  const t = placeToken(label,false,G.tokens);
  if(t) G.tokens.push(t);
}

      html += '<span class="ltr '+cls+'">'+ (i<=G.wordIdx ? w[i] : "־") +'</span>';

}

/* ===================== EFFECTS ===================== */
function burst(cx, cy, colors, n){
  if(REDUCED) return;
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = 40+Math.random()*180;
    G.particles.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:1,
      col:pick(colors), r:2+Math.random()*4, spin:Math.random()*6});
  }
}
function confetti(){
  if(REDUCED) return;
  const cols=["#F5A524","#5FD9A4","#E85D42","#57B6F0","#F7C948","#9B6BF0"];
  for(let i=0;i<46;i++){
    G.particles.push({x:Math.random()*boardPx, y:-10-Math.random()*60,
      vx:(Math.random()-.5)*70, vy:110+Math.random()*160, life:1.6,
      col:pick(cols), r:3+Math.random()*4, spin:Math.random()*8});
  }
}
function floatText(cx,cy,text,col){

}

/* ===================== GAME FLOW ===================== */
function startGame(){
  const diff = G.startDiff||1;
  G.level = G.mode==="math" ? [1,3,5][diff-1] : diff;
  G.maxLevel = G.mode==="math" ? 6 : 3;
  G.snake = [];
  const my = Math.floor(GRID/2);
  for(let i=0;i<4;i++) G.snake.push({x:Math.floor(GRID/2)-i, y:my});
  G.prev = G.snake.map(s=>({...s}));
  G.dir = {x:1,y:0}; G.queue=[]; G.grow=0;
  G.score=0; G.correct=0; G.mistakes=0; G.streak=0; G.wrongStreak=0; G.wordsDone=0;
  G.particles=[]; G.floats=[]; G.shake=0; G.flash=0;
  G.dead=false; G.paused=false; G.running=true;
  G.best = store.get("best_"+G.mode, 0);
  if(G.mode==="spell"){ G.word = pickWord(G.level); G.wordIdx=0; }
  updateSpeed();
  $("#menu").classList.remove("on");
  $("#overScreen").classList.remove("on");
  $("#pauseScreen").classList.remove("on");
  $("#app").hidden = false;
  resize();
  spawnRound();
  updateHud();
  G.last = performance.now();
  requestAnimationFrame(loop);
}
function updateSpeed(){
  const base = G.mode==="math" ? 300 : 290;
  G.moveMs = clamp(base - G.level*16 - G.correct*2, 130, 320);
}
function updateHud(){
  $("#vScore").textContent = G.score;
  $("#vLevel").textContent = G.level;
  $("#vBest").textContent = Math.max(G.best, G.score);
}

function levelCheck(){
  const need = G.mode==="math" ? 3 : 2;
  if(G.streak>=need && G.level<G.maxLevel){
    G.level++; G.streak=0; G.wrongStreak=0;
    SFX.levelup(); confetti(); toast("רמה "+G.level+"! 🚀","#F5A524");
  } else if(G.wrongStreak>=2 && G.level>1){
    G.level--; G.wrongStreak=0; G.streak=0;
    toast("קצת יותר קל 🙂","#57B6F0");
  }
  updateSpeed();
}

function onCorrect(tok){
  const cx=(tok.x+.5)*cell, cy=(tok.y+.5)*cell;
  G.correct++; G.wrongStreak=0;
  burst(cx,cy,["#5FD9A4","#F5A524","#F7C948","#FFFFFF"],22);

  if(G.mode==="math"){
    G.streak++;
    const gain = 10*G.level;
    G.score += gain; G.grow += 3;
    floatText(cx,cy,"+"+gain,"#5FD9A4");
    SFX.good();
    levelCheck();
    G.q = null; spawnRound();
  } else {
    G.wordIdx++; G.grow += 2;
    const gain = 5*G.level;
    G.score += gain; floatText(cx,cy,"+"+gain,"#5FD9A4");
    if(G.wordIdx>=G.word.w.length){
      const bonus = 20*G.level;
      G.score += bonus; G.grow += 3; G.wordsDone++; G.streak++;
      SFX.word(); confetti();
      toast(G.word.w+" ✓  +"+bonus,"#5FD9A4");
      renderPrompt();
      levelCheck();
      G.word = pickWord(G.level); G.wordIdx=0;
      setTimeout(()=>{ if(G.running && !G.dead) spawnRound(); }, 420);
      G.tokens=[];
      updateHud();
      return;
    }
    SFX.good();
    spawnRound();
  }
  updateHud();
}
function onWrong(tok){
  const cx=(tok.x+.5)*cell, cy=(tok.y+.5)*cell;
  G.mistakes++; G.wrongStreak++; G.streak=0;
  SFX.bad();
  G.shake = 1; G.flash = 1; G.flashColor="#E85D42";
  burst(cx,cy,["#E85D42","#FFB4A2"],14);
  floatText(cx,cy,"אופס","#E85D42");
  $("#prompt").classList.remove("shake"); void $("#prompt").offsetWidth; $("#prompt").classList.add("shake");
  // shrink the tail a little, never below 3
  for(let i=0;i<2;i++) if(G.snake.length>3) G.snake.pop();
  G.prev = G.prev.slice(0, G.snake.length);
  G.score = Math.max(0, G.score-3);
  replaceWrongToken(tok);
  if(G.wrongStreak>=2) levelCheck();
  updateHud();
}

function step(){
  // apply queued direction
  if(G.queue.length){
    const d = G.queue.shift();
    if(!(d.x===-G.dir.x && d.y===-G.dir.y)) G.dir = d;
  }
  G.prev = G.snake.map(s=>({...s}));
  const h = G.snake[0];
  const nh = {x:(h.x+G.dir.x+GRID)%GRID, y:(h.y+G.dir.y+GRID)%GRID};

  // self collision (ignore the very last segment when not growing — it moves away)
  const limit = G.grow>0 ? G.snake.length : G.snake.length-1;
  for(let i=0;i<limit;i++){
    if(G.snake[i].x===nh.x && G.snake[i].y===nh.y){ gameOver(); return; }
  }

  G.snake.unshift(nh);
  if(G.grow>0) G.grow--; else G.snake.pop();
  if(G.prev.length<G.snake.length) G.prev.push({...G.snake[G.snake.length-1]});

  const hit = G.tokens.find(t=>t.x===nh.x && t.y===nh.y);
  if(hit){
    hit.pop = 1;
    if(hit.correct) onCorrect(hit); else onWrong(hit);
  }
}

function gameOver(){
  G.running=false; G.dead=true; G.deadAt=G.t;
  SFX.over();
  G.shake=1.4;
  const head = G.snake[0];
  burst((head.x+.5)*cell,(head.y+.5)*cell,["#E85D42","#F5A524","#FFFFFF"],26);
  const prevBest = store.get("best_"+G.mode,0);
  const best = Math.max(prevBest, G.score);
  store.set("best_"+G.mode, best);
  G.best = best;
  const stars = G.score>=400?"⭐⭐⭐" : G.score>=180?"⭐⭐" : G.score>0?"⭐":"✨";
  $("#overScore").textContent = G.score;
  $("#overStars").textContent = stars;
  $("#overTitle").textContent = (G.score>prevBest && G.score>0) ? "שיא חדש! 🏆" : "אופס!";
  $("#overMsg").textContent = "הנחש התנגש בזנב של עצמו. מהקירות אפשר לעבור — מהזנב לא!";
  const recap = G.mode==="math"
    ? [["תשובות נכונות",G.correct],["רמה שהגעת",G.level],["שיא",best]]
    : [["מילים שהשלמת",G.wordsDone],["אותיות נכונות",G.correct],["שיא",best]];
  $("#overRecap").innerHTML = recap.map(r=>"<div><b>"+r[1]+"</b><span>"+r[0]+"</span></div>").join("");
  setTimeout(()=>$("#overScreen").classList.add("on"), 700);
}

/* ===================== INPUT ===================== */
const DIRS = { up:{x:0,y:-1}, down:{x:0,y:1}, left:{x:-1,y:0}, right:{x:1,y:0} };
function turn(name){
  const d = DIRS[name]; if(!d || !G.running || G.paused) return;
  const lastQ = G.queue.length ? G.queue[G.queue.length-1] : G.dir;
  if(d.x===-lastQ.x && d.y===-lastQ.y) return;
  if(d.x===lastQ.x && d.y===lastQ.y) return;
  if(G.queue.length<2) G.queue.push(d);
}
addEventListener("keydown",(e)=>{
  const map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right",
             w:"up",s:"down",a:"left",d:"right",W:"up",S:"down",A:"left",D:"right"};
  if(map[e.key]){ e.preventDefault(); turn(map[e.key]); }
  if(e.key===" "){ e.preventDefault(); if(G.running) togglePause(); }
});

let sx=0, sy=0, swiping=false;
const wrapEl = $("#boardWrap");
wrapEl.addEventListener("touchstart",(e)=>{ audio(); const t=e.touches[0]; sx=t.clientX; sy=t.clientY; swiping=true; },{passive:true});
wrapEl.addEventListener("touchmove",(e)=>{

/* ===================== RENDER ===================== */
function rrect(x,y,w,h,r){
  if(ctx.roundRect){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); return; }
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function segColor(i,skin){
  if(skin.rainbow) return "hsl("+(((i*16)+G.hueShift)%360)+" 84% 60%)";
  return skin.body;
}
function drawBoard(){
  // garden bed
  const g = ctx.createLinearGradient(0,0,0,boardPx);
  g.addColorStop(0,"#F7EAD0"); g.addColorStop(1,"#E9D4AC");
  ctx.fillStyle=g; ctx.fillRect(0,0,boardPx,boardPx);
  // furrows
  ctx.strokeStyle="rgba(180,150,100,.28)"; ctx.lineWidth=1;
  ctx.beginPath();
  for(let i=1;i<GRID;i++){
    ctx.moveTo(Math.round(i*cell)+.5,0); ctx.lineTo(Math.round(i*cell)+.5,boardPx);
    ctx.moveTo(0,Math.round(i*cell)+.5); ctx.lineTo(boardPx,Math.round(i*cell)+.5);
  }
  ctx.stroke();
  // vignette
  const v = ctx.createRadialGradient(boardPx/2,boardPx/2,boardPx*0.30,boardPx/2,boardPx/2,boardPx*0.76);
  v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(80,55,15,.16)");
  ctx.fillStyle=v; ctx.fillRect(0,0,boardPx,boardPx);
}
function drawTokens(){
  const fs = Math.round(cell*0.46);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const t of G.tokens){
    ctx.font = "700 "+Math.round(t.label.length>2 ? fs*0.72 : fs)+"px Fredoka, Heebo, sans-serif";
    const age = Math.min(1,(G.t-t.born)/0.22);
    const pulse = REDUCED?1:(1+Math.sin(G.t*3+t.x+t.y)*0.035);
    const s = (0.5+0.5*age)*pulse;
    const cx=(t.x+.5)*cell, cy=(t.y+.5)*cell;
    const w = cell*0.84*s, h = cell*0.84*s;
    ctx.save();
    ctx.translate(cx,cy);
    // shadow
    ctx.fillStyle="rgba(90,65,20,.22)";
    rrect(-w/2, -h/2+3.5, w, h, w*0.32); ctx.fill();
    // pod
    const pg = ctx.createLinearGradient(0,-h/2,0,h/2);
    pg.addColorStop(0,"#FFFDF7"); pg.addColorStop(1,"#FFEFC9");
    ctx.fillStyle=pg;
    rrect(-w/2,-h/2,w,h,w*0.32); ctx.fill();
    ctx.lineWidth=Math.max(2,cell*0.06); ctx.strokeStyle="#B98A3C"; ctx.stroke();
    // leaf stem
    ctx.fillStyle="#5EA04A";
    ctx.beginPath();
    ctx.ellipse(w*0.20,-h/2-1, w*0.14, w*0.07, -0.6, 0, Math.PI*2);
    ctx.fill();
    // label
    ctx.fillStyle="#22160A";
    ctx.fillText(t.label, 0, h*0.04);
    ctx.restore();
  }
}
function lerpSeg(i,a){
  const p = G.prev[i] || G.snake[i], c = G.snake[i];
  let dx = c.x-p.x, dy = c.y-p.y;
  if(Math.abs(dx)>1 || Math.abs(dy)>1) return {x:(c.x+.5)*cell, y:(c.y+.5)*cell};
  return {x:(p.x+dx*a+.5)*cell, y:(p.y+dy*a+.5)*cell};
}
function drawSnake(a){
  const skin = SKINS[G.skin];
  const pts = G.snake.map((s,i)=>lerpSeg(i,a));
  ctx.lineCap="round"; ctx.lineJoin="round";
  if(skin.glow && !REDUCED){ ctx.shadowColor=skin.body; ctx.shadowBlur=cell*0.5; }
  // body
  for(let i=pts.length-1;i>0;i--){
    const p1=pts[i], p0=pts[i-1];
    if(Math.hypot(p1.x-p0.x,p1.y-p0.y) > cell*1.6) continue; // wrap gap
    const taper = 1 - (i/pts.length)*0.42;
    ctx.strokeStyle = segColor(i,skin);
    ctx.lineWidth = cell*0.80*taper;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  }
  ctx.shadowBlur=0;
  // belly highlight
  for(let i=pts.length-1;i>0;i--){
    const p1=pts[i], p0=pts[i-1];
    if(Math.hypot(p1.x-p0.x,p1.y-p0.y) > cell*1.6) continue;
    const taper = 1 - (i/pts.length)*0.42;
    ctx.strokeStyle = skin.belly; ctx.globalAlpha=0.30;
    ctx.lineWidth = cell*0.34*taper;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    ctx.globalAlpha=1;
  }
  // spots
  if(!skin.rainbow){
    ctx.fillStyle=skin.spot; ctx.globalAlpha=0.55;
    for(let i=2;i<pts.length;i+=3){
      const taper = 1-(i/pts.length)*0.42;
      ctx.beginPath(); ctx.arc(pts[i].x,pts[i].y, cell*0.13*taper, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha=1;
  }
  // head
  const h=pts[0], d=G.dir, r=cell*0.46;
  ctx.fillStyle = skin.rainbow ? segColor(0,skin) : skin.body;
  if(skin.glow && !REDUCED){ ctx.shadowColor=skin.body; ctx.shadowBlur=cell*0.7; }
  ctx.beginPath(); ctx.arc(h.x,h.y,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0;
  // tongue
  const flick = Math.sin(G.t*7);
  if(flick>0.4){
    ctx.strokeStyle="#E8436B"; ctx.lineWidth=Math.max(1.6,cell*0.075);
    const tl = r*(0.8+flick*0.5);
    ctx.beginPath();
    ctx.moveTo(h.x+d.x*r*0.7, h.y+d.y*r*0.7);
    ctx.lineTo(h.x+d.x*(r+tl), h.y+d.y*(r+tl));
    ctx.stroke();
  }
  // eyes
  const px=-d.y, py=d.x;
  for(const s of [1,-1]){
    const ex = h.x + d.x*r*0.34 + px*s*r*0.44;
    const ey = h.y + d.y*r*0.34 + py*s*r*0.44;
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(ex,ey,r*0.30,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=skin.eye;
    ctx.beginPath(); ctx.arc(ex+d.x*r*0.10, ey+d.y*r*0.10, r*0.16,0,Math.PI*2); ctx.fill();
  }
}
function drawFx(dt){
  for(let i=G.particles.length-1;i>=0;i--){
    const p=G.particles[i];
    p.life -= dt*(p.life>1?0.7:1.6);
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt; p.vx *= 0.99;
    if(p.life<=0){ G.particles.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1,p.life);
    ctx.fillStyle = p.col;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin+G.t*4);
    ctx.fillRect(-p.r,-p.r*0.6,p.r*2,p.r*1.2);
    ctx.restore();
    ctx.globalAlpha=1;
  }
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(let i=G.floats.length-1;i>=0;i--){
    const f=G.floats[i];
    f.life -= dt*1.1; f.y -= dt*46;
    if(f.life<=0){ G.floats.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1,f.life*1.4);
    ctx.font = "700 "+Math.round(cell*0.52)+"px Fredoka, Heebo, sans-serif";
    ctx.lineWidth=Math.max(3,cell*0.1); ctx.strokeStyle="rgba(255,255,255,.85)";
    ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle=f.col; ctx.fillText(f.text,f.x,f.y);
    ctx.globalAlpha=1;
  }
}

/* ===================== MAIN LOOP ===================== */
function loop(now){
  if(!G.running || G.paused){
    // let the crash settle: keep animating shake + particles for a beat
    if(G.dead && G.t - (G.deadAt||0) < 1.4){
      const d = Math.min(0.05,(now-G.last)/1000);
      G.last = now; G.t += d;
      drawFrame(clamp(G.acc/G.moveMs,0,1), d);
      requestAnimationFrame(loop);
    } else if(G.dead){
      drawFrame(clamp(G.acc/G.moveMs,0,1), 0.016);
    }
    return;
  }
  const dt = Math.min(0.05,(now-G.last)/1000);
  G.last = now; G.t += dt;
  G.acc += dt*1000;
  while(G.acc >= G.moveMs){
    G.acc -= G.moveMs;
    step();
    if(!G.running) break;
  }
  const alpha = clamp(G.acc/G.moveMs,0,1);
  drawFrame(alpha, dt);
  requestAnimationFrame(loop);
}
function drawFrame(alpha, dt){
  G.hueShift = (G.hueShift + dt*70)%360;
  ctx.save();
  if(G.shake>0){
    const m = G.shake*7;
    ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);
    G.shake = Math.max(0, G.shake - dt*3.2);
  }
  drawBoard();
  drawTokens();
  drawSnake(alpha);
  drawFx(dt);
  ctx.restore();
  if(G.flash>0){
    ctx.fillStyle = G.flashColor;
    ctx.globalAlpha = G.flash*0.26;
    ctx.fillRect(0,0,boardPx,boardPx);
    ctx.globalAlpha=1;
    G.flash = Math.max(0, G.flash - dt*3);
  }
}
</script>
